name: Import BCR V7 approved yacht hero
on:
  push:
    branches: [feature/bcr-v7-yacht-hero]
    paths: [.github/workflows/bcr-v7-import.yml]
permissions:
  contents: write
jobs:
  import-hero-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bcr-v7-yacht-hero
          persist-credentials: true
      - name: Download, optimize, and commit the approved yacht footage
        env:
          MEDIA_URL: https://sb-66ntxp79npku.vercel.run/source-yacht.mp4
        run: |
          set -euo pipefail
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          curl --fail --location --retry 5 --retry-delay 2 --max-time 180 "$MEDIA_URL" -o /tmp/bcr-source.mp4
          test "$(stat -c%s /tmp/bcr-source.mp4)" -gt 20000000
          cd Benson_Charles_Invitation_Only_RSVP_V4/benson-retirement-site
          mkdir -p assets
          ffmpeg -hide_banner -loglevel error -y -i /tmp/bcr-source.mp4 -vf "scale=1536:-2,crop=1536:864:0:(in_h-out_h)/2,fps=24,format=yuv420p" -an -c:v libx264 -preset medium -crf 21 -movflags +faststart /tmp/bcr-web.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/bcr-web.mp4 -frames:v 1 -update 1 /tmp/bcr-first.png
          ffmpeg -hide_banner -loglevel error -y -i /tmp/bcr-web.mp4 -loop 1 -framerate 24 -t 0.9 -i /tmp/bcr-first.png -filter_complex "[0:v]settb=AVTB[v0];[1:v]scale=1536:864,fps=24,format=rgba,settb=AVTB[v1];[v0][v1]xfade=transition=fade:duration=0.9:offset=7.141667,format=yuv420p[v]" -map "[v]" -an -r 24 -c:v libx264 -preset medium -crf 20 -movflags +faststart assets/BCR-yacht-hero-loop-polished.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/bcr-first.png -frames:v 1 -q:v 3 -update 1 assets/BCR-yacht-hero-poster.jpg
          ffprobe -v error -show_entries stream=width,height,r_frame_rate:format=duration,size -of default=noprint_wrappers=1 assets/BCR-yacht-hero-loop-polished.mp4
          test "$(stat -c%s assets/BCR-yacht-hero-loop-polished.mp4)" -gt 2500000
          cd ../..
          git config user.name "bcr-media-import"
          git config user.email "actions@users.noreply.github.com"
          git add Benson_Charles_Invitation_Only_RSVP_V4/benson-retirement-site/assets/BCR-yacht-hero-*
          git commit -m "assets: add optimized V7 yacht hero video and poster [skip ci]"
          git push origin HEAD:feature/bcr-v7-yacht-hero
