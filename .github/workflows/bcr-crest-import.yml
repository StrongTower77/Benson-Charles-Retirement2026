name: Import official retirement crest
on:
  push:
    branches: [feature/benson-official-crest]
    paths: [.github/workflows/bcr-crest-import.yml]
permissions:
  contents: write
jobs:
  import-crest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/benson-official-crest
          persist-credentials: true
      - name: Verify and commit exact original transparent crest
        run: |
          set -euo pipefail
          DEST=Benson_Charles_Invitation_Only_RSVP_V4/benson-retirement-site/assets/benson-charles-official-crest.png
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL --retry 5 --max-time 150 'https://sb-69rw3otnelu9.vercel.run/benson-charles-official-crest.png' -o "$DEST"
          echo '94698b0038ee0e1b7bfe5f15ccd33a5eba213e6cb466e378f0956d4e78b893e9  '${DEST} | sha256sum -c -
          file "$DEST"
          git config user.name "benson-crest-import"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          git commit -m "assets: add original Benson Charles retirement crest [skip ci]"
          git push origin HEAD:feature/benson-official-crest
